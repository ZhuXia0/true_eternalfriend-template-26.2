<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>像素工坊 · Pixel Art Studio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{color-scheme:dark;--bg:#111310;--panel:#191c17;--panel2:#20241e;--line:#30362d;--muted:#8d9587;--text:#edf1e8;--lime:#c4f36b;--orange:#ff9d5c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,"Microsoft YaHei",sans-serif;min-height:100vh}.top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 4vw}.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:-.4px}.mark{width:30px;height:30px;background:var(--lime);display:grid;place-items:center;color:#151810;font-family:monospace;font-size:20px;font-weight:bold}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px;font-weight:500;margin-top:2px}.top-right{font:12px 'DM Mono',monospace;color:var(--muted)}.top-right i{color:var(--lime);font-style:normal}.page{max-width:1320px;margin:auto;padding:36px 28px 60px}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px}.eyebrow{font:11px 'DM Mono',monospace;color:var(--lime);letter-spacing:2px}.heading h1{font-size:32px;letter-spacing:-1.3px;margin:9px 0 5px}.heading p{font-size:13px;color:var(--muted);margin:0}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}.stage,.side{background:var(--panel);border:1px solid var(--line);border-radius:10px}.stage{padding:18px;min-width:0}.stagebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.stagebar strong{font-size:13px}.tag{font:10px 'DM Mono',monospace;color:var(--lime);background:#28321c;padding:6px 8px;border-radius:4px}.canvas-wrap{height:min(61vh,590px);min-height:320px;background-color:#161914;background-image:linear-gradient(45deg,#20241e 25%,transparent 25%),linear-gradient(-45deg,#20241e 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#20241e 75%),linear-gradient(-45deg,transparent 75%,#20241e 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;display:grid;place-items:center;overflow:hidden;border:1px solid #30362d;border-radius:6px}canvas{image-rendering:pixelated;image-rendering:crisp-edges;max-width:100%;max-height:100%;object-fit:contain;touch-action:none;cursor:crosshair}.toolbar{display:flex;align-items:center;gap:7px;margin-top:14px;flex-wrap:wrap}.tool,.btn{height:34px;border:1px solid var(--line);border-radius:5px;background:var(--panel2);color:var(--text);padding:0 11px;font:12px Manrope,sans-serif;cursor:pointer}.tool:hover,.btn:hover{border-color:#626b58}.tool.active{border-color:var(--lime);color:var(--lime);background:#252c1d}.spacer{flex:1}.side{padding:17px;height:max-content}.section+.section{border-top:1px solid var(--line);margin-top:18px;padding-top:17px}.sect-title{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;margin-bottom:13px}.sect-title span:last-child{font:10px 'DM Mono',monospace;color:var(--muted)}label{font-size:11px;color:var(--muted);display:block;margin:0 0 7px}select,input[type=text]{width:100%;height:36px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:5px;padding:0 10px;font:12px Manrope,sans-serif;outline:none}select:focus,input:focus{border-color:var(--lime)}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.colors{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px}.swatch{width:25px;height:25px;border-radius:5px;border:2px solid transparent;cursor:pointer;position:relative}.swatch.selected{border-color:#fff;outline:2px solid var(--lime)}input[type=color]{width:25px;height:25px;padding:0;border:0;border-radius:5px;background:none;overflow:hidden;cursor:pointer}.range-row{display:flex;align-items:center;gap:10px}input[type=range]{flex:1;accent-color:var(--lime)}.hint{font-size:10px;color:var(--muted);line-height:1.6;margin-top:9px}.wide{width:100%;margin-top:8px}.primary{background:var(--lime);color:#161910;border-color:var(--lime);font-weight:800}.primary:hover{background:#d4ff89}.generate-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.footer-note{margin-top:18px;color:var(--muted);font-size:10px;text-align:center}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,15px);opacity:0;background:#e9f2dd;color:#182013;padding:10px 15px;border-radius:5px;font-size:12px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:820px){.workspace{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.section+.section{border-top:0;margin-top:0;padding-top:0}.section:nth-child(n+3){border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.canvas-wrap{height:52vh}.heading h1{font-size:26px}}@media(max-width:520px){.page{padding:24px 13px}.top{padding:0 15px}.top-right{display:none}.heading{align-items:start}.heading p{max-width:250px;line-height:1.6}.stage{padding:11px}.canvas-wrap{min-height:260px;height:44vh}.side{padding:13px;grid-template-columns:1fr}.section+.section,.section:nth-child(n+3){border-top:1px solid var(--line);padding-top:14px;margin-top:14px}}
</style></head>
<body><header class="top"><div class="brand"><div class="mark">✳</div><div>像素工坊<small>PIXEL ART STUDIO</small></div></div><div class="top-right"><i>●</i> LOCAL · READY</div></header>
<main class="page"><div class="heading"><div><div class="eyebrow">CREATE / PIXEL / EXPORT</div><h1>把灵感，变成像素。</h1><p>从空白画布开始，或生成一个灵感草稿。作品保存在本地浏览器。</p></div></div>
<div class="workspace"><section class="stage"><div class="stagebar"><strong>画布</strong><span id="dimTag" class="tag">32 × 32 PX</span></div><div class="canvas-wrap"><canvas id="canvas" width="32" height="32" aria-label="像素画布"></canvas></div><div class="toolbar"><button class="tool active" data-tool="pen">✎ 画笔</button><button class="tool" data-tool="eraser">⌫ 橡皮</button><button class="tool" data-tool="picker">⌖ 吸管</button><span class="spacer"></span><button class="tool" id="undo">↶ 撤销</button><button class="tool" id="clear">清空</button></div></section>
<aside class="side"><div class="section"><div class="sect-title">画布设置<span>01 / SIZE</span></div><div class="row"><div><label for="resolution">像素精度</label><select id="resolution"><option value="16">16 × 16</option><option value="32" selected>32 × 32</option><option value="64">64 × 64</option><option value="96">96 × 96</option><option value="128">128 × 128</option></select></div><div><label>当前尺寸</label><input id="sizeText" type="text" value="32 × 32 px" readonly></div></div><div class="hint">调整精度会创建新画布，当前绘制内容将被清空。</div></div>
<div class="section"><div class="sect-title">颜色<span>02 / PALETTE</span></div><div id="colors" class="colors"></div><div class="row"><div><label>自定义颜色</label><input id="customColor" type="color" value="#c4f36b" style="width:100%;height:36px"></div><div><label>当前选中</label><input id="hexColor" type="text" value="#c4f36b" maxlength="7"></div></div></div>
<div class="section"><div class="sect-title">灵感生成<span>03 / GENERATE</span></div><label for="seed">随机种子（可复现）</label><input id="seed" type="text" value="little-world-01"><div class="generate-grid" style="margin-top:10px"><button class="btn" data-gen="heart">♥ 爱心</button><button class="btn" data-gen="slime">☻ 史莱姆</button><button class="btn" data-gen="flower">✿ 小花</button><button class="btn" data-gen="noise">✳ 随机拼色</button></div><button class="btn wide" id="symmetry">◐ 生成对称图案</button><div class="hint">生成结果可以继续用画笔编辑。相同种子会生成相同的随机图案。</div></div>
<div class="section"><div class="sect-title">导出作品<span>04 / EXPORT</span></div><button class="btn primary wide" id="png">↓ 下载 PNG 图片</button><button class="btn wide" id="json">{ } 导出 JSON 数据</button><button class="btn wide" id="import">↑ 导入 JSON 数据</button><input id="file" type="file" accept="application/json,.json" hidden><div class="hint">JSON 包含尺寸、颜色矩阵和色板，可用于程序读取或后续继续编辑。</div></div></aside></div><div class="footer-note">PIXEL ART STUDIO · 在你的浏览器本地运行</div></main><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),resolution=document.querySelector('#resolution'),palette=['#c4f36b','#ff9d5c','#f26b6b','#b89aff','#71c9ff','#f4e7c5','#30362d','#111310'];let n=32,pixels=Array.from({length:n},()=>Array(n).fill(null)),color=palette[0],tool='pen',drawing=false,history=[];const $=s=>document.querySelector(s);function draw(){ctx.clearRect(0,0,n,n);for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(pixels[y][x]){ctx.fillStyle=pixels[y][x];ctx.fillRect(x,y,1,1)}$('#dimTag').textContent=`${n} × ${n} PX`;$('#sizeText').value=`${n} × ${n} px`}function save(){history.push(pixels.map(r=>r.slice()));if(history.length>40)history.shift()}function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}function setColor(c){if(!/^#[0-9a-f]{6}$/i.test(c))return;color=c.toLowerCase();$('#hexColor').value=color;$('#customColor').value=color;document.querySelectorAll('.swatch').forEach(e=>e.classList.toggle('selected',e.dataset.color===color))}function renderPalette(){const el=$('#colors');el.innerHTML='';palette.forEach(c=>{const b=document.createElement('button');b.className='swatch';b.style.background=c;b.title=c;b.dataset.color=c;b.onclick=()=>setColor(c);el.append(b)})}function pos(e){const r=canvas.getBoundingClientRect();return [Math.floor((e.clientX-r.left)*n/r.width),Math.floor((e.clientY-r.top)*n/r.height)]}function apply(e){const [x,y]=pos(e);if(x<0||x>=n||y<0||y>=n)return;if(tool==='picker'){if(pixels[y][x])setColor(pixels[y][x]);return}const next=tool==='eraser'?null:color;if(pixels[y][x]!==next){pixels[y][x]=next;draw()}}canvas.addEventListener('pointerdown',e=>{drawing=true;canvas.setPointerCapture(e.pointerId);save();apply(e)});canvas.addEventListener('pointermove',e=>{if(drawing&&tool!=='picker')apply(e)});canvas.addEventListener('pointerup',()=>drawing=false);canvas.addEventListener('pointercancel',()=>drawing=false);document.querySelectorAll('.tool[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('.tool[data-tool]').forEach(x=>x.classList.toggle('active',x===b))});$('#undo').onclick=()=>{if(history.length){pixels=history.pop();draw()}else toast('没有可撤销的操作')};$('#clear').onclick=()=>{save();pixels=Array.from({length:n},()=>Array(n).fill(null));draw()};resolution.onchange=()=>{n=+resolution.value;pixels=Array.from({length:n},()=>Array(n).fill(null));history=[];canvas.width=canvas.height=n;draw()};$('#customColor').oninput=e=>setColor(e.target.value);$('#hexColor').onchange=e=>setColor(e.target.value);
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return h>>>0}function rng(seed){let a=hash(seed);return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}function blank(){pixels=Array.from({length:n},()=>Array(n).fill(null))}function put(x,y,c){if(x>=0&&y>=0&&x<n&&y<n)pixels[y][x]=c}function generate(kind){save();blank();const cx=n>>1,cy=n>>1,unit=Math.max(1,Math.floor(n/16)),scale=(v)=>Math.round(v*n/32),c=palette;const rand=rng($('#seed').value||'pixel');if(kind==='heart'){for(let y=0;y<n;y++)for(let x=0;x<n;x++){let xx=(x-cx)/(n*.34),yy=(y-cy)/(n*.34);if(Math.pow(xx*xx+yy*yy-1,3)-xx*xx*yy*yy*yy<=0)put(x,y,c[2])}for(let i=0;i<scale(7);i++)put(cx-scale(7)+i,cy-scale(8),c[0]);for(let i=0;i<scale(4);i++)put(cx-scale(8),cy-scale(8)+i,c[0])}else if(kind==='slime'){for(let y=scale(10);y<scale(26);y++)for(let x=scale(7);x<scale(25);x++){if(y<scale(13)&&Math.abs(x-cx)>scale(6))continue;put(x,y,c[0])}for(const x of [scale(12),scale(20)])for(let yy=scale(16);yy<scale(20);yy++)put(x,yy,c[6]);for(let x=scale(14);x<scale(19);x++)put(x,scale(22),c[6]);put(scale(11),scale(13),c[5]);put(scale(12),scale(12),c[5])}else if(kind==='flower'){const petals=[[0,-5],[-4,-3],[4,-3],[-4,2],[4,2],[0,5]];petals.forEach(([dx,dy])=>{for(let yy=-scale(2);yy<=scale(2);yy++)for(let xx=-scale(2);xx<=scale(2);xx++)if(xx*xx+yy*yy<=scale(2)**2)put(cx+scale(dx)+xx,cy+scale(dy)+yy,c[1])});for(let y=-scale(2);y<=scale(2);y++)for(let x=-scale(2);x<=scale(2);x++)if(x*x+y*y<=scale(2)**2)put(cx+x,cy+y,c[4]);for(let y=cy+scale(6);y<n-scale(3);y++)put(cx,y,c[0]);for(let i=0;i<scale(4);i++){put(cx-scale(1)-i,cy+scale(10)+i,c[0]);put(cx+scale(1)+i,cy+scale(14)+i,c[0])}}else{const colors=c.slice(0,6);for(let y=0;y<n;y++)for(let x=0;x<Math.ceil(n/2);x++)if(rand()>.49){const col=colors[Math.floor(rand()*colors.length)];put(x,y,col);put(n-1-x,y,col)}}draw();toast('灵感图案已生成')}
document.querySelectorAll('[data-gen]').forEach(b=>b.onclick=()=>generate(b.dataset.gen));$('#symmetry').onclick=()=>generate('noise');$('#png').onclick=()=>{const out=document.createElement('canvas');out.width=out.height=n*12;const o=out.getContext('2d');o.imageSmoothingEnabled=false;for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(pixels[y][x]){o.fillStyle=pixels[y][x];o.fillRect(x*12,y*12,12,12)}const a=document.createElement('a');a.download=`pixel-art-${n}x${n}.png`;a.href=out.toDataURL('image/png');a.click()};function data(){return{format:'pixel-art-studio',version:1,width:n,height:n,palette:[...new Set(pixels.flat().filter(Boolean))],pixels:pixels.map(row=>row.map(v=>v||null))}}$('#json').onclick=()=>{const blob=new Blob([JSON.stringify(data(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`pixel-art-${n}x${n}.json`;a.click();URL.revokeObjectURL(a.href)};$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(d.format!=='pixel-art-studio'||!Number.isInteger(d.width)||d.width!==d.height||d.width<1||d.width>256||!Array.isArray(d.pixels)||d.pixels.length!==d.height||d.pixels.some(r=>!Array.isArray(r)||r.length!==d.width))throw Error();n=d.width;resolution.value=['16','32','64','96','128'].includes(String(n))?String(n):'128';canvas.width=canvas.height=n;pixels=d.pixels.map(row=>row.map(c=>/^#[0-9a-f]{6}$/i.test(c||'')?c:null));history=[];draw();toast('作品已导入')}catch{toast('JSON 格式无效或尺寸不受支持')}e.target.value=''};renderPalette();draw()})();
</script></body></html>
